<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grace · GateWay Las Vegas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../app/styles.css?v=11">
<style>
  .pw-overlay{position:fixed;inset:0;background:rgba(21,32,43,.45);display:flex;align-items:center;justify-content:center;z-index:90}
  .pw-overlay[hidden]{display:none}
  .pw-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px 24px;width:min(400px,92vw)}
  .pw-card b{font-size:17px}
</style>
</head>
<body class="ops">
<header class="ops-top">
  <div style="display:flex;align-items:center;gap:12px">
    <img src="../assets/gateway-logo.png" alt="" style="height:32px">
    <div class="who"><b>GateWay Las Vegas</b><br>People file</div>
  </div>
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <span class="tiny" id="headCount">Loading</span>
    <label class="tiny" style="display:flex;align-items:center;gap:6px">
      <input type="checkbox" id="autoReply" checked>
      Watch auto-reply
    </label>
    <a class="btn btn-ghost" href="kids.html">Kids desk</a>
    <a class="btn btn-ghost" href="sunday.html" target="_blank" rel="noopener">Sunday screen</a>
    <button class="btn btn-ghost" id="btnPw">Password</button>
    <button class="btn btn-ghost" id="btnOut">Sign out</button>
  </div>
</header>
<div class="ops-body">
  <aside class="ops-list">
    <div class="ops-tools">
      <input type="search" id="q" placeholder="Search name, family, class">
      <div class="ops-filters">
        <button class="on" data-f="all">All</button>
        <button data-f="here">Here</button>
        <button data-f="visitors">Visitors</button>
        <button data-f="family">Families</button>
        <button data-f="kids">Kids</button>
        <button data-f="prayer">Prayer</button>
        <button data-f="inbox">Inbox</button>
        <button data-f="serve">Serve</button>
        <button data-f="hello">Hellos</button>
        <button data-f="auto">Auto</button>
      </div>
    </div>
    <div class="ops-people" id="people"></div>
  </aside>
  <section class="ops-file" id="file">
    <p class="ops-empty">Select someone on the left.</p>
  </section>
</div>

<aside class="grace-dock" id="graceDock">
  <div class="grace-head">
    <div>
      <b>Grace</b>
      <span class="tiny" id="graceState">Typed</span>
    </div>
    <button class="btn btn-ink" id="graceTalk" type="button">Talk</button>
  </div>
  <div class="grace-log" id="graceLog"></div>
  <div class="grace-compose">
    <input id="graceQ" placeholder="Ask about a visitor, a family, a class, who is here…">
    <button class="btn btn-ghost" id="graceAsk" type="button">Ask</button>
  </div>
</aside>

<div class="pw-overlay" id="pwOverlay" hidden>
  <div class="pw-card">
    <b>Change password</b>
    <div class="field"><label>New password</label><input id="pwNew" type="password" autocomplete="new-password"></div>
    <div class="field"><label>Confirm new password</label><input id="pwConfirm" type="password" autocomplete="new-password"></div>
    <p class="tiny" id="pwMsg" style="min-height:18px;margin:0 0 12px"></p>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn btn-ghost" id="pwCancel" type="button">Cancel</button>
      <button class="btn btn-ink" id="pwSave" type="button">Save</button>
    </div>
  </div>
</div>

<script src="../app/gcc-config.js?v=10"></script>
<script src="../app/gcc-data.js?v=10"></script>
<script src="gcc-ops.js?v=10"></script>
<script src="gcc-visitors.js?v=10"></script>
<script src="gcc-grace-voice.js?v=10"></script>
<script type="module" src="staff-app.js?v=12"></script>
</body>
</html>
